# Phase 3: Data Model
data_model:
  entities:
    - name: "robots"
      description: "Fleet of Sparrow, Hercules, Proteus, Sequoia units — id, family, fc_site, firmware version, install date, status. Foundation table everything joins to."
      layer: "delta"
    - name: "telemetry"
      description: "Time-series signals — vibration, temperature, motor current, vacuum pressure, battery SoH, LiDAR health. Drives anomaly detection and trend dashboards."
      layer: "delta"
    - name: "anomalies"
      description: "Detected anomaly events — robot_id, signal, severity, detected_at, model_version. Bridges telemetry to diagnostics."
      layer: "delta"
    - name: "work_orders"
      description: "RME work orders — robot_id, status, priority, technician, parts_used, created_at, resolved_at. Agent writes via Lakebase MCP."
      layer: "lakebase"
    - name: "service_manual_chunks"
      description: "RAG-indexed snippets from robot service manuals and RME runbooks. Source for governed retrieval use case."
      layer: "delta"
    - name: "agent_memory"
      description: "Persistent diagnostics, remediations, and outcomes. Survives Sparrow v4 to v5 model upgrades — the differentiator vs Project Eluna."
      layer: "lakebase"
  kpis:
    - name: "Fleet availability %"
      description: "Robots up divided by total robots. Headline RME metric."
    - name: "MTBF (Mean Time Between Failures)"
      description: "By robot family — Sparrow, Hercules, Proteus, Sequoia reliability trend."
    - name: "MTTR (Mean Time To Repair)"
      description: "Average resolution time per work order. Improvement story for agent-assisted remediation."
    - name: "Open anomalies (severity)"
      description: "Count of unresolved anomalies bucketed by critical/high/medium/low. Drives the wow-moment incident card."
    - name: "Autonomous resolution rate"
      description: "Percent of anomalies resolved by agent without human escalation. Mirrors Cox/Druva 63% benchmark."
    - name: "Downtime avoided ($)"
      description: "Dollar value of prevented failures. Ties to $150K-$400K per FC annual impact."
  historical_range: "6 months"
  anomalies_layer: "delta"
  lakebase_tables:
    - "notes"            # scaffold core_schema.sql
    - "agent_actions"    # scaffold core_schema.sql
    - "workflows"        # scaffold core_schema.sql
    - "work_orders"      # domain
    - "agent_memory"     # domain — persistent fleet memory

# Phase 4: AI Layer
ai_layer:
  genie_tables:
    - "robots"
    - "telemetry"
    - "anomalies"
  mas_persona: |
    You are the Fleet Health copilot for Amazon Robotics RME teams.
    You reduce operator cognitive load by reasoning over telemetry,
    service manuals, and historical remediations, then rendering
    recommendations at the right depth for the requester's role
    (RME Technician vs RME Lead). Every retrieval is governed by
    Unity Catalog; every diagnostic is persisted in Lakebase so the
    fleet's institutional memory survives model upgrades.
  sub_agents:
    - type: "genie-space"
      name: "fleet-telemetry-genie"
      genie_space_id: "01f15ab4bb591f2c8817b56d3e06ccaa"
      description: "Natural-language SQL over robots, telemetry, and anomalies. Use for fleet KPIs, anomaly counts, robot-family comparisons, FC-site filters, and trend questions."
    - type: "external-mcp-server"
      name: "mcp-lakebase-connection"
      connection_name: "amz_robotics_mcp_conn"
      description: "Lakebase write operations. Use to create work_orders, update anomaly status, persist diagnostics to agent_memory (so memory survives model upgrades), and add notes. Tool names: insert_record, update_records, execute_sql, read_query."
  uc_functions: []
  deploy_lakebase_mcp: true
  knowledge_assistant:
    deferred: true
    note: "KA REST API not exposed without Databricks MCP tools. Create via Workspace UI (Playground > New KA) over service_manual_chunks Delta table after deploy, then PATCH MAS to add it."
    source_table: "service_manual_chunks"
    description: "Robot service manuals + RME procedural runbooks for Sparrow, Hercules, Proteus, Sequoia."
  # IDs written back after Phase 8C
  genie_space_id: "01f15ab4bb591f2c8817b56d3e06ccaa"
  mas_tile_id: "326dad44-a816-4b0b-9652-6a7964bb8ad2"
  mas_tile_id_short: "326dad44"
  mas_serving_endpoint: "mas-326dad44-endpoint"
  lakebase_mcp_app_url: "https://lakebase-mcp-server-7474653834780775.aws.databricksapps.com"
  lakebase_mcp_sp_client_id: "304f3453-a399-4647-80e6-68fb81a275b0"
  uc_http_connection: "amz_robotics_mcp_conn"

# Phase 5: UI
ui:
  layout: "sidebar"
  color_scheme:
    preset: "brand-match"
    primary: "#232F3E"   # Amazon Squid Ink
    accent: "#FF9900"    # Amazon Orange
    green: "#10b981"
    red: "#ef4444"
    blue: "#3b82f6"
    style: "dark-industrial"
  dashboard:
    layout: "kpi_strip + fleet_map + incident_feed + activity"
    components:
      - "kpi_cards"          # 6 KPIs from Phase 3
      - "fleet_map"          # heatmap by FC site, severity colored
      - "open_incidents"     # severity-pilled list of open anomalies
      - "recent_activity"    # agent_actions + agent_memory feed
  pages:
    - name: "Dashboard"
      key: "dashboard"
      description: "KPI strip (6 metrics) + FC-site fleet map + open incidents + recent agent activity. Exec landing page."
    - name: "Fleet"
      key: "fleet"
      description: "Robots list + detail. Filter by family (Sparrow/Hercules/Proteus/Sequoia), FC site, status. Detail view shows recent telemetry + anomalies + WO history."
    - name: "Incidents"
      key: "incidents"
      description: "Anomalies list + detail with persona switcher (RME Tech | RME Lead). THE WOW MOMENT. Same agent query, different render depth."
    - name: "Work Orders"
      key: "work_orders"
      description: "Lakebase CRUD surface. Open/in-progress/closed filter. Agent-created work orders show source incident + remediation steps."
    - name: "Memory"
      key: "memory"
      description: "agent_memory feed. Differentiator vs Eluna — shows persisted diagnostics with model_version stamps to prove memory survives Sparrow v4 → v5 upgrades."
    - name: "Service Manuals"
      key: "manuals"
      description: "Browse + search service_manual_chunks. Shows UC lineage column. Demonstrates governed RAG corpus."
    - name: "AI Chat"
      key: "chat"
      description: "Built-in. Customize suggested prompts for fleet health + persona-aware queries."
    - name: "Workflows"
      key: "workflows"
      description: "Built-in. Wires approve → create work_order + agent_memory entries (side effects per Gotcha #26)."
  wow_moment_location: "Incidents page — persona switcher tab on incident detail card"
